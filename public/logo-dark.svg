<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 60" fill="none" aria-label="Web Lunar">
  <defs>
    <mask id="moon-mask-dark">
      <rect width="60" height="60" fill="white"/>
      <circle cx="37" cy="22" r="22" fill="black"/>
    </mask>
  </defs>

  <!-- Lua crescente -->
  <circle cx="26" cy="30" r="18" fill="#050505" mask="url(#moon-mask-dark)"/>

  <!-- Ponto/estrela -->
  <circle cx="52" cy="16" r="2.5" fill="#050505"/>

  <!-- Wordmark -->
  <text
    x="70"
    y="38"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="17"
    font-weight="500"
    letter-spacing="4"
    fill="#050505"
  >WEB LUNAR</text>
</svg>
