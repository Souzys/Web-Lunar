<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1902 885" width="1902" height="885">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090A0F"/>
      <stop offset="50%" stop-color="#111420"/>
      <stop offset="100%" stop-color="#08090C"/>
    </linearGradient>
    <radialGradient id="glow1" cx="75%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="25%" cy="80%" r="45%">
      <stop offset="0%" stop-color="#1D4DFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1D4DFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5E6B3"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA8220"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1E2E" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0D0F17" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="1902" height="885" fill="url(#bg)"/>
  <rect width="1902" height="885" fill="url(#glow1)"/>
  <rect width="1902" height="885" fill="url(#glow2)"/>
  <!-- Subtle Grid -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <line x1="0" y1="160" x2="1902" y2="160"/>
    <line x1="0" y1="442" x2="1902" y2="442"/>
    <line x1="0" y1="725" x2="1902" y2="725"/>
    <line x1="380" y1="0" x2="380" y2="885"/>
    <line x1="951" y1="0" x2="951" y2="885"/>
    <line x1="1520" y1="0" x2="1520" y2="885"/>
  </g>
  <!-- Top Nav Bar -->
  <text x="140" y="95" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" letter-spacing="8">AURA ATELIER</text>
  <text x="820" y="92" fill="#9CA3AF" font-family="monospace" font-size="13" letter-spacing="3">BRAND SYSTEM // 2026</text>
  <rect x="1600" y="68" width="162" height="40" rx="20" fill="none" stroke="#D4AF37" stroke-opacity="0.5" stroke-width="1.5"/>
  <text x="1681" y="93" fill="#F5E6B3" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="2" text-anchor="middle">GUIDELINES</text>

  <!-- Left Content: Brand Typography & Identity -->
  <rect x="140" y="210" width="175" height="32" rx="16" fill="#D4AF37" fill-opacity="0.12" stroke="#D4AF37" stroke-opacity="0.35"/>
  <text x="227" y="231" fill="#F5E6B3" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="2.5" text-anchor="middle">BRAND IDENTITY</text>
  
  <text x="140" y="340" fill="#FFFFFF" font-family="Georgia, serif" font-size="86" font-weight="400" letter-spacing="-2">Estética Minimal</text>
  <text x="140" y="435" fill="url(#goldGrad)" font-family="Georgia, serif" font-style="italic" font-size="86" font-weight="400" letter-spacing="-1">&amp; Atemporal.</text>
  
  <text x="140" y="510" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="21" font-weight="300">Sistema visual completo, tipografia proprietária, direção de arte</text>
  <text x="140" y="542" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="21" font-weight="300">e embalagens de alto padrão para marca de luxo contemporâneo.</text>

  <!-- Color Swatches -->
  <g transform="translate(140, 610)">
    <rect x="0" y="0" width="110" height="125" rx="14" fill="#0B0C10" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="16" y="98" fill="#ffffff" font-family="monospace" font-size="12" font-weight="700">OBSIDIAN</text>
    <text x="16" y="114" fill="#6B7280" font-family="monospace" font-size="11">#0B0C10</text>

    <rect x="128" y="0" width="110" height="125" rx="14" fill="#D4AF37"/>
    <text x="144" y="98" fill="#090A0F" font-family="monospace" font-size="12" font-weight="700">GOLD LEAF</text>
    <text x="144" y="114" fill="#272210" font-family="monospace" font-size="11">#D4AF37</text>

    <rect x="256" y="0" width="110" height="125" rx="14" fill="#F4F1EA"/>
    <text x="272" y="98" fill="#090A0F" font-family="monospace" font-size="12" font-weight="700">RAW SILK</text>
    <text x="272" y="114" fill="#57534E" font-family="monospace" font-size="11">#F4F1EA</text>

    <rect x="384" y="0" width="110" height="125" rx="14" fill="#1E2436" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="400" y="98" fill="#ffffff" font-family="monospace" font-size="12" font-weight="700">DEEP NAVY</text>
    <text x="400" y="114" fill="#9CA3AF" font-family="monospace" font-size="11">#1E2436</text>
  </g>

  <!-- Right Side: Brand Book / Monogram Card Showcase -->
  <g transform="translate(1040, 175)">
    <!-- Back Card -->
    <rect x="110" y="40" width="610" height="490" rx="24" fill="#121521" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>
    <!-- Front Main Brand Card -->
    <rect x="0" y="0" width="620" height="510" rx="24" fill="url(#cardGrad)" stroke="#D4AF37" stroke-opacity="0.35" stroke-width="1.5"/>
    
    <!-- Golden Geometric Monogram -->
    <circle cx="310" cy="215" r="105" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>
    <circle cx="310" cy="215" r="78" fill="none" stroke="#D4AF37" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="6 6"/>
    <path d="M310 125 L368 275 L252 275 Z" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <line x1="274" y1="230" x2="346" y2="230" stroke="#F5E6B3" stroke-width="2"/>
    <circle cx="310" cy="188" r="6" fill="#F5E6B3"/>

    <text x="310" y="375" fill="#FFFFFF" font-family="Georgia, serif" font-size="32" letter-spacing="10" text-anchor="middle">AURA</text>
    <text x="310" y="405" fill="#D4AF37" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="6" text-anchor="middle">PARIS · SÃO PAULO · MILANO</text>

    <!-- Spec Lines -->
    <line x1="60" y1="445" x2="560" y2="445" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="60" y="475" fill="#9CA3AF" font-family="monospace" font-size="12" letter-spacing="2">FIG. 01 — MONOGRAM CONSTRUCTION</text>
    <text x="560" y="475" fill="#F5E6B3" font-family="monospace" font-size="12" letter-spacing="2" text-anchor="end">RATIO 1:1.618</text>
  </g>
</svg>
