<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1902 885" width="1902" height="885">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A0E"/>
      <stop offset="50%" stop-color="#0E1722"/>
      <stop offset="100%" stop-color="#06080B"/>
    </linearGradient>
    <radialGradient id="emeraldGlow" cx="72%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow" cx="20%" cy="20%" r="45%">
      <stop offset="0%" stop-color="#1D4DFF" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#1D4DFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="prodCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16202E"/>
      <stop offset="100%" stop-color="#0B1018"/>
    </linearGradient>
  </defs>
  <rect width="1902" height="885" fill="url(#bg2)"/>
  <rect width="1902" height="885" fill="url(#emeraldGlow)"/>
  <rect width="1902" height="885" fill="url(#blueGlow)"/>

  <!-- Top Storefront Header -->
  <rect x="90" y="42" width="1722" height="72" rx="18" fill="#111823" fill-opacity="0.75" stroke="#ffffff" stroke-opacity="0.07"/>
  <text x="140" y="86" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" letter-spacing="6">KRONOS</text>
  <text x="640" y="84" fill="#E5E7EB" font-family="system-ui, sans-serif" font-size="14" font-weight="500" letter-spacing="1.5">COLEÇÃO 2026</text>
  <text x="820" y="84" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="14" font-weight="500" letter-spacing="1.5">CRONÓGRAFOS</text>
  <text x="1000" y="84" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="14" font-weight="500" letter-spacing="1.5">EDIÇÃO LIMITADA</text>
  <rect x="1605" y="58" width="175" height="40" rx="20" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.4"/>
  <text x="1692" y="83" fill="#34D399" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">SACOLA (2) · R$ 4.890</text>

  <!-- Left Hero E-commerce Copy -->
  <rect x="140" y="195" width="240" height="32" rx="16" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-opacity="0.35"/>
  <text x="260" y="216" fill="#34D399" font-family="system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="2" text-anchor="middle">HEADLESS COMMERCE · 99/100</text>

  <text x="140" y="315" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="76" font-weight="800" letter-spacing="-2">Engenharia de</text>
  <text x="140" y="400" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="76" font-weight="800" letter-spacing="-2">Alta Precisão.</text>

  <text x="140" y="470" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="20" font-weight="400">Titânio aeroespacial grau 5, vidro de safira antirreflexo e</text>
  <text x="140" y="500" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="20" font-weight="400">checkout instantâneo em 1 clique via Pix e Apple Pay.</text>

  <!-- Price & Buy CTA -->
  <text x="140" y="575" fill="#6B7280" font-family="monospace" font-size="13" letter-spacing="2">EDIÇÃO NUMERADA // ESTOQUE IMEDIATO</text>
  <text x="140" y="625" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="44" font-weight="800">R$ 2.490</text>
  <text x="345" y="620" fill="#34D399" font-family="system-ui, sans-serif" font-size="16" font-weight="600">ou 12x de R$ 207,50 sem juros</text>

  <rect x="140" y="665" width="280" height="64" rx="32" fill="url(#accentBtn)"/>
  <text x="280" y="704" fill="#06120E" font-family="system-ui, sans-serif" font-size="15" font-weight="800" letter-spacing="2" text-anchor="middle">COMPRAR AGORA →</text>

  <rect x="440" y="665" width="210" height="64" rx="32" fill="#16202E" stroke="#ffffff" stroke-opacity="0.12"/>
  <text x="545" y="704" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="1.5" text-anchor="middle">VER ESPECIFICAÇÕES</text>

  <!-- Right Side: Product Showcase Card & Fast Checkout Widget -->
  <g transform="translate(1020, 175)">
    <rect x="0" y="0" width="740" height="580" rx="28" fill="url(#prodCard)" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
    
    <!-- Minimalist Luxury Watch Illustration -->
    <g transform="translate(275, 285)">
      <!-- Watch Strap Top & Bottom -->
      <rect x="-52" y="-215" width="104" height="90" rx="10" fill="#1E293B" stroke="#475569" stroke-width="2"/>
      <rect x="-52" y="125" width="104" height="90" rx="10" fill="#1E293B" stroke="#475569" stroke-width="2"/>
      <!-- Watch Case -->
      <circle cx="0" cy="0" r="142" fill="#0F172A" stroke="#64748B" stroke-width="6"/>
      <circle cx="0" cy="0" r="126" fill="#090D16" stroke="#10B981" stroke-opacity="0.5" stroke-width="2"/>
      <!-- Dial Markers -->
      <line x1="0" y1="-112" x2="0" y2="-95" stroke="#FFFFFF" stroke-width="4"/>
      <line x1="112" y1="0" x2="95" y2="0" stroke="#FFFFFF" stroke-width="4"/>
      <line x1="0" y1="112" x2="0" y2="95" stroke="#FFFFFF" stroke-width="4"/>
      <line x1="-112" y1="0" x2="-95" y2="0" stroke="#FFFFFF" stroke-width="4"/>
      <!-- Watch Hands -->
      <line x1="0" y1="0" x2="-45" y2="-55" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="68" y2="-38" stroke="#34D399" stroke-width="4" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="8" fill="#10B981"/>
      <text x="0" y="-52" fill="#9CA3AF" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="4" text-anchor="middle">KRONOS</text>
      <text x="0" y="65" fill="#34D399" font-family="monospace" font-size="10" letter-spacing="2" text-anchor="middle">CHRONO 300M</text>
    </g>

    <!-- Floating Conversion / Checkout Badge -->
    <g transform="translate(430, 55)">
      <rect x="0" y="0" width="270" height="135" rx="18" fill="#0D1520" stroke="#10B981" stroke-opacity="0.45" stroke-width="1.5"/>
      <text x="24" y="38" fill="#9CA3AF" font-family="monospace" font-size="11" letter-spacing="1.5">TAXA DE CONVERSÃO</text>
      <text x="24" y="82" fill="#34D399" font-family="system-ui, sans-serif" font-size="40" font-weight="800">+148%</text>
      <text x="24" y="112" fill="#E5E7EB" font-family="system-ui, sans-serif" font-size="13">Checkout sub-segundo</text>
    </g>

    <!-- Floating Variant Selector -->
    <g transform="translate(430, 385)">
      <rect x="0" y="0" width="270" height="145" rx="18" fill="#0D1520" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
      <text x="24" y="36" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1">ACABAMENTO DA CAIXA</text>
      <circle cx="44" cy="76" r="16" fill="#1E293B" stroke="#34D399" stroke-width="3"/>
      <circle cx="92" cy="76" r="16" fill="#D4AF37" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>
      <circle cx="140" cy="76" r="16" fill="#E5E7EB" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5"/>
      <text x="24" y="122" fill="#34D399" font-family="monospace" font-size="12" font-weight="600">● ENVIO EXPRESSO HOJE</text>
    </g>
  </g>
</svg>
