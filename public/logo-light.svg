<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 60" fill="none" aria-label="Web Lunar">
  <defs>
    <mask id="moon-mask">
      <!-- Área visível: tudo branco -->
      <rect width="60" height="60" fill="white"/>
      <!-- Punch-out: círculo maior, deslocado para cima-direita -->
      <circle cx="37" cy="22" r="22" fill="black"/>
    </mask>
  </defs>

  <!-- Lua crescente: círculo principal com máscara -->
  <circle cx="26" cy="30" r="18" fill="white" mask="url(#moon-mask)"/>

  <!-- Ponto/estrela: à direita do crescente, alinhado verticalmente com a ponta superior -->
  <circle cx="52" cy="16" r="2.5" fill="white"/>

  <!-- Wordmark -->
  <text
    x="70"
    y="38"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="17"
    font-weight="500"
    letter-spacing="4"
    fill="white"
  >WEB LUNAR</text>
</svg>
